<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="55%" stop-color="#220812"/>
      <stop offset="100%" stop-color="#0C0C0E"/>
    </linearGradient>
    <linearGradient id="facadeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#500F24"/>
      <stop offset="50%" stop-color="#D6B46A"/>
      <stop offset="100%" stop-color="#500F24"/>
    </linearGradient>
    <radialGradient id="plazaReflect" cx="50%" cy="68%" r="48%">
      <stop offset="0%" stop-color="#D6B46A" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#500F24" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#duskSky)"/>
  <!-- Architectural Multiplex Massing -->
  <rect x="130" y="170" width="1020" height="410" rx="18" fill="#131316" stroke="#D6B46A" stroke-opacity="0.28" stroke-width="2"/>
  <rect x="190" y="210" width="900" height="8" rx="4" fill="url(#facadeGlow)" opacity="0.9"/>
  <!-- Glass Atrium Fins -->
  <g fill="#1B191C" stroke="#D6B46A" stroke-opacity="0.18">
    <rect x="210" y="250" width="140" height="330" rx="6"/>
    <rect x="375" y="250" width="140" height="330" rx="6"/>
    <rect x="540" y="250" width="200" height="330" rx="6" fill="#230A13"/>
    <rect x="765" y="250" width="140" height="330" rx="6"/>
    <rect x="930" y="250" width="140" height="330" rx="6"/>
  </g>
  <!-- Warm Interior Atrium Light -->
  <rect x="565" y="290" width="150" height="290" rx="4" fill="#D6B46A" opacity="0.16"/>
  <rect x="595" y="340" width="90" height="240" rx="2" fill="#EAD092" opacity="0.22"/>
  <!-- Canopy & Plaza -->
  <polygon points="100,580 1180,580 1280,800 0,800" fill="#0B0B0D"/>
  <ellipse cx="640" cy="645" rx="490" ry="70" fill="url(#plazaReflect)"/>
  <rect x="440" y="545" width="400" height="12" rx="6" fill="#D6B46A" opacity="0.72"/>
  <!-- Exterior Architectural Bollards -->
  <g fill="#EAD092" opacity="0.75">
    <circle cx="280" cy="625" r="4"/><circle cx="440" cy="625" r="4"/>
    <circle cx="840" cy="625" r="4"/><circle cx="1000" cy="625" r="4"/>
  </g>
</svg>
